name: CI

on:
  pull_request:
    branches:
    - '*'
  push:
    branches:
    - main

defaults:
  run:
    shell: bash

jobs:
  all:
    name: All

    strategy:
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest

    runs-on: ${{matrix.os}}

    env:
      RUSTFLAGS: --deny warnings

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust Toolchain Components
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Test
      run: cargo test --all

    - name: Clippy
      run: cargo clippy --all --all-targets -- -D warnings

    - name: Format
      run: cargo fmt --all --check

    # Optional, non-gating SAST. Installs Semgrep best-effort and runs the
    # Rust security pack for visibility. continue-on-error ensures findings —
    # or a failed/absent install — never block the build. Linux only.
    - name: SAST (Semgrep, optional)
      if: runner.os == 'Linux'
      continue-on-error: true
      run: |
        python3 -m pip install --user semgrep || pipx install semgrep || true
        bash scripts/run-sast.sh